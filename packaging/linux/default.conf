# /etc/default/quickshare-direct: settings for the quickshare-direct Wi-Fi helpers.
# Wi-Fi station interface (default: the first managed Wi-Fi interface)
#QS_STA=wlan0
# Direct link for receiving: p2p (Wi-Fi Direct group, default) or ap (hotspot, needs hostapd)
#QS_MODE=p2p
# nftables chain for the temporary firewall rule when neither firewalld nor ufw is active
#QS_NFT_CHAIN=inet filter input
# When the direct link would need a second channel next to the Wi-Fi connection: auto (leave the
# Wi-Fi network for the transfer only when there's no other way), always (whenever the channels
# differ; full speed), never
#QS_SINGLE_CHANNEL=auto
# LE connection interval for the Bluetooth links the laptop opens (sending), in 1.25 ms units:
# "MIN MAX" (default "6 12" = 7.5-15 ms; the kernel default 30-50 ms limits sending over
# Bluetooth to ~5 KB/s), or "off" to keep the kernel default
#QS_LE_CONN_INTERVAL="6 12"
